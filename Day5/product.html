
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            background-color: #f9f9f9;

            display: flex;
            justify-content: center;
            gap: 25px;
            align-items:center;
            flex-wrap: wrap;

        }
        .product{
            border: 1px solid black;
            border-radius: 12px;
            width: 250px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
            /* box-shadow Xaxis Yaxis Spread-Radius ColorName; */
            box-shpadow: 4px 4px 8px black;
        }

            .product:hover{
            background-color: #ff0000;
            transition: 2s;
            transform: scale(1.03);
            color: white;
        }


        .product img{
            width: 100%;
            height: 160px;
            object-fit: cover;

            border-radius: 12px;
        }
        .product button{
            background-color: orange;
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 90%;
            
        }
        
    </style>
</head>
<body>
    <div>
        <img src="https://images.pexels.com/photos/12920900/pexels-photo-12920900.jpeg" width="150" height="150">
        <h2> Headphone</h2>
        <p>Rs 2,499</p>
        <button> Buy now </button>
    </div>
    <div>
        <img src="https://images.pexels.com/photos/26823084/pexels-photo-26823084.jpeg"width="150" height="150">
        <h2> Pista</h2>
        <p>Rs 500</p>
        <button>Buy Now </button>
    </div>
    <div>
        <img src="https://images.pexels.com/photos/6893890/pexels-photo-6893890.jpeg"width="150" height="150">
        <h2> Laptop</h2>
        <p>Rs 25000</p>
        <button>Buy Now </button>
    </div>
    <div>
        <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg"width="150" height="150">
        <h2> mobile</h2>
        <p>Rs 9,999</p>
        <button>Buy Now </button>
    </div>
</body>
</html>
