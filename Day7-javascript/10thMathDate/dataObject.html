
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let result  = new Date

        document.write  (result.getDate())
        document.write  (result.getDay())  //Monday starts with 1
        document.write  (result.getMonth())  // January starts with 0
        document.write  (result.getFullYear())
        document.write  (result.getTime())  //milliseconds

        document.write  (result.toLocaleTimeString())
        document.write  (result.getMinutes())
        document.write  (result.getSeconds())
    </script>
</body>
</html>
