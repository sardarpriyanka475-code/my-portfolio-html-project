
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
           
           //Math Object - Help us To Calucaltion and Math Related wokr directly

           document.write( Math.PI )+'<br>'
           document.write( Math.SQRT2 )+'<br>'
           document.write( Math.sqrt(25) )+'<br>'

           document.write( Math.pow(2,4) )+'<br>'

           //Logic

           document.write( Math.random() )+'<br>'  //By Default in range of 0 - 1

           //Floor - It will Remove The Decimal Number 4.5  --> 4

            document.write(Math.floor(4.8)+'<br>')   // 4
            document.write(Math.floor(2.1))+'<br>'  //  2


           //Ceil -It Converts To Next Higher Whole Number 4.2 --> 5

           document.write(Math.ceil(3.1))+'<br>'   // 4
           document.write(Math.ceil(5.7))+'<br>'   // 6


           //Round if Decimal Nymber < 0.5  -->Remove Deciaml and If Number is > 0.5 or Number is == 0.5->Next higher Whole Number

           document.write(Math.round(6.4))+'<br>'    // 6
           document.write(Math.round(6.5))+'<br>'    //  7
           document.write(Math.round(6.6))+'<br>'    //  7


           document.write( Math.floor(  Math.random() * 4   ))+'<br>'  //0-3

    </script>
</body>
</html>
