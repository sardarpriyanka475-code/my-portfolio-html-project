    <script>
    //RULES: condition is true loop starts condition flase loop stops
    //1. for(start point; ending/condition; ++ or -- (operation))
    for(let i = 1; i<= 10; i++)
    {
        document.write("The value of i is:" + i + "<br>");

    }
    //print number 10 to 1 - console
    for (let j =10; j>=10; j--)
{

    document.write("The value of j is:" + j + "<br>");
}    
//RULE: Condition is true loop starts condition flase loop stops
//2. while(condition){task} Loop
let count = 1
while(count<=5){
    document.write("Login Attemp:", count + "<br>");
    count++
}
// 3. do while loop - It will execute - run the code atleat one time

// Array - use for loop for accessing data of array
