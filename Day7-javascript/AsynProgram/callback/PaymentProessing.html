<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function processingPayment(amount,callback){
            document.write("Processing payment of Rs."+amount+"<br>");
            let status = "Payment Successful";

            callback(status);
        }
        function paymentResult(status){
            document.write(status + "<br>");
            document.write("Thank you for your payment");

        }
        processingPayment(500,paymentResult);
    </script>
</body>
</html>
